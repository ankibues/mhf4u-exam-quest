/* ---------------- RENDER ---------------- */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (screen === "list") {
    const progress = loadProgress();
    app.innerHTML += `<div class="card"><div class="progress">
      Problems completed: ${Object.keys(progress).length} / ${PROBLEMS.length}
    </div></div><br>`;
    PROBLEMS.forEach((p, i) => {
      app.innerHTML += `
        <div class="card" style="margin-bottom:12px">
          <div class="tag">${p.topic}</div>
          <h3>${p.title}</h3>
          <button onclick="startProblem(${i})">
            ${progress[p.id] ? "Practice Again" : "Start"}
          </button>
        </div>`;
    });
    return;
  }

  const problem = PROBLEMS[currentProblem];
  const stage = problem.stages[stepIndex];

  app.innerHTML += `
  <div class="card">
    <div class="row">
      <button onclick="backStep()">← Back Step</button>
      <button onclick="goList()">Back to Problems</button>
    </div>

    <div class="progress">Step ${stepIndex+1} / ${problem.stages.length} · ${problem.topic}</div>
    ${stage.prompt ? `<h3>${stage.prompt}</h3>` : ""}
    <h4>${stage.question}</h4>
  `;

  stage.choices.forEach((c, i) => {
    let cls = "choice";
    if (lastClick && lastClick.index === i) {
      cls += lastClick.correct ? " correct" : " wrong";
    }
    app.innerHTML += `
      <div class="${cls}" onclick="choose(${i})">${c[0]}</div>
    `;
  });

  if (lastClick && lastClick.correct) {
    app.innerHTML += `
      <div class="feedback">
        ✅ Correct — ${stage.choices[lastClick.index][2]}
      </div>
      <div class="row">
        <button onclick="nextStep()">Next Step →</button>
      </div>
    `;
  } else if (lastClick && !lastClick.correct) {
    app.innerHTML += `
      <div class="feedback">
        ❌ Try again. ${stage.choices[lastClick.index][2]}
      </div>
    `;
  }

  app.innerHTML += `</div>`;
}

/* ---------------- ACTIONS ---------------- */
function startProblem(i) {
  currentProblem = i;
  stepIndex = 0;
  lastClick = null;
  awaitingNext = false;
  screen = "problem";
  render();
}
function goList() {
  screen = "list";
  render();
}
function backStep() {
  if (stepIndex > 0) {
    stepIndex--;
    lastClick = null;
    awaitingNext = false;
    render();
  }
}
function choose(i) {
  if (lastClick && lastClick.correct) return;

  const stage = PROBLEMS[currentProblem].stages[stepIndex];
  const isCorrect = stage.choices[i][1];

  lastClick = { index: i, correct: isCorrect };

  // 🔊 Play sound (user-initiated → allowed)
  if (isCorrect) {
    correctSound.currentTime = 0;
    correctSound.play();
  } else {
    wrongSound.currentTime = 0;
    wrongSound.play();
  }

  render();
}

function nextStep() {
  lastClick = null;
  stepIndex++;
  if (stepIndex >= PROBLEMS[currentProblem].stages.length) {
    const p = loadProgress();
    p[PROBLEMS[currentProblem].id] = true;
    saveProgress(p);
    goList();
    return;
  }
  render();
}

/* ---------------- INIT ---------------- */
render();
